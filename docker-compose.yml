version: '3.9'
services:
  backend:
    build: .                
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env           
  frontend:
    build: ./frontend      
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
